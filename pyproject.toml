[project]
name = "langfuse-agent-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ilya Verbitskiy", email = "ilich" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "crewai[google-genai]>=1.15.44",
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
langfuse-agent-demo = "langfuse_agent_demo:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.fastapi]
entrypoint = "langfuse_agent_demo.main:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "FAST"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
markers = ["llm: calls the real LLM; run with make test-llm"]
addopts = "-m 'not llm'"
